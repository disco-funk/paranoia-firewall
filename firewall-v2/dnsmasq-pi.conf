# Raspberry Pi DNS config — forwards to 127.0.0.1:5300 (Python DoT proxy during bootstrap,
# stubby permanently). Port 5300 is the same for both, so this file needs no changes when
# stubby replaces the proxy.
no-resolv
no-poll
server=127.0.0.1#5300
listen-address=127.0.0.1
bind-interfaces
# IANA root KSK (key tag 20326, valid since 2018 rollover)
trust-anchor=.,20326,8,2,E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D
dnssec
dnssec-check-unsigned
