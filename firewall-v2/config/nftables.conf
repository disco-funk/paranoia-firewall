flush ruleset
table inet filter {
	set icmp4_errors {
		type icmp_type
		elements = { destination-unreachable,
			     time-exceeded,
			     parameter-problem }
	}

	set icmp6_errors {
		type icmpv6_type
		elements = { destination-unreachable,
			     packet-too-big,
			     time-exceeded,
			     parameter-problem }
	}

